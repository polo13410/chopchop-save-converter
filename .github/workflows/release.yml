name: Build and release

# Push a tag like v1.0.0 to build the Windows .exe and publish it as a GitHub release.
# Can also be run by hand from the Actions tab (the .exe is then kept as a build artifact).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        run: python -m unittest discover tests -v

      - name: Build the .exe
        run: |
          python -m pip install -r requirements-build.txt
          python -m PyInstaller --noconfirm --clean --onefile --console --name ChopChopSaveConverter --add-data "data;data" chopchop_convert.py

      - name: Self-test the .exe
        run: dist\ChopChopSaveConverter.exe --self-test

      - uses: actions/upload-artifact@v4
        with:
          name: ChopChopSaveConverter
          path: dist/ChopChopSaveConverter.exe

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ChopChopSaveConverter.exe
          generate_release_notes: true
