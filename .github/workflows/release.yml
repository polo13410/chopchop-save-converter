name: Build and release

# Every push to main: run the tests, build the Windows .exe on GitHub's servers,
# sign a build provenance attestation for it, and publish a GitHub release with
# the .exe, its SHA-256 hash, and the list of changes since the previous release.
# Can also be run by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write      # create the release and its tag
  id-token: write      # sign the attestation (Sigstore)
  attestations: write  # store the attestation on GitHub

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history and tags, to list the changes since the last release

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        run: python -m unittest discover tests -v

      - name: Build the .exe
        run: |
          python -m pip install -r requirements-build.txt
          python -m PyInstaller --noconfirm --clean --onefile --console --name ChopChopSaveConverter --add-data "data;data" chopchop_convert.py

      - name: Self-test the .exe
        run: dist\ChopChopSaveConverter.exe --self-test

      - name: Version, tag and SHA-256
        id: meta
        shell: pwsh
        run: |
          $version = python -c "import chopchop; print(chopchop.__version__)"
          $tag = "v$version-build.${{ github.run_number }}"
          $hash = (Get-FileHash dist\ChopChopSaveConverter.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  ChopChopSaveConverter.exe" | Out-File -Encoding ascii dist\ChopChopSaveConverter.exe.sha256
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Release notes
        shell: pwsh
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          SHA256: ${{ steps.meta.outputs.sha256 }}
        run: |
          # The previous release is the most recent v* tag (this release's tag does not exist yet).
          $previous = git tag --list "v*" --sort=-creatordate | Select-Object -First 1
          $format = "- %s ([%h](https://github.com/$env:REPO/commit/%H))"
          if ($previous) {
            $changes = git log --no-merges --pretty=format:$format "$previous..HEAD"
            $compare = "[Full comparison with $previous](https://github.com/$env:REPO/compare/$previous...$env:SHA)"
          } else {
            $changes = git log --no-merges --pretty=format:$format
            $compare = "First release."
          }
          if (-not $changes) { $changes = "- No code change (rebuild)." }

          $template = @'
          Download **ChopChopSaveConverter.exe**, close the game, and double-click it. See the [README](https://github.com/{REPO}#how-to-use-it) for the full guide.

          ### What changed

          {CHANGES}

          {COMPARE}

          ### Verify your download

          This file was built by GitHub Actions from commit [`{SHA}`](https://github.com/{REPO}/commit/{SHA}), [build log here](https://github.com/{REPO}/actions/runs/{RUN_ID}).

          **SHA-256:** `{SHA256}`

          Check it in PowerShell, the two values must be identical:
          ```
          (Get-FileHash .\ChopChopSaveConverter.exe -Algorithm SHA256).Hash
          ```

          Stronger check, with the [GitHub CLI](https://cli.github.com/): it proves the file was built by this repository's workflow.
          ```
          gh attestation verify .\ChopChopSaveConverter.exe --repo {REPO}
          ```
          '@
          $notes = $template.Replace("{CHANGES}", ($changes -join "`n")).Replace("{COMPARE}", $compare)
          $notes = $notes.Replace("{REPO}", $env:REPO).Replace("{SHA}", $env:SHA).Replace("{RUN_ID}", $env:RUN_ID).Replace("{SHA256}", $env:SHA256)
          $notes | Out-File -Encoding utf8 release-notes.md
          Get-Content release-notes.md

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/ChopChopSaveConverter.exe

      - uses: actions/upload-artifact@v4
        with:
          name: ChopChopSaveConverter
          path: |
            dist/ChopChopSaveConverter.exe
            dist/ChopChopSaveConverter.exe.sha256

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Chop Chop Save Converter ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            dist/ChopChopSaveConverter.exe
            dist/ChopChopSaveConverter.exe.sha256
          body_path: release-notes.md
